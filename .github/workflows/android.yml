name: Збірка APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Збірка, unit-тести, емулятор
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Середовище
        run: |
          mkdir -p ci-output
          {
            echo "Дата: $(date -u)"
            java -version 2>&1
            ./gradlew --version
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          } 2>&1 | tee ci-output/environment.txt

      - name: ./gradlew clean assembleDebug
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean assembleDebug 2>&1 | tee ci-output/assembleDebug_log.txt
          echo "assembleDebug exit code: ${PIPESTATUS[0]}" | tee -a ci-output/assembleDebug_log.txt

      - name: Unit-тести
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee ci-output/unit_tests_log.txt
          echo "testDebugUnitTest exit code: ${PIPESTATUS[0]}" | tee -a ci-output/unit_tests_log.txt

      - name: Перевірка APK (шлях, розмір, підпис, маніфест)
        run: |
          set -o pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "Шлях: $APK"
            ls -l "$APK"
            echo "Розмір, байт: $(stat -c %s "$APK")"
            echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo
            echo "== apksigner verify =="
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            echo
            echo "== aapt2 dump badging =="
            "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|application-label|launchable-activity|native-code" || true
          } 2>&1 | tee ci-output/apk_verification.txt

      - name: UI-тести APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebugAndroidTest 2>&1 | tee ci-output/assembleDebugAndroidTest_log.txt

      - name: Звіти тестів
        if: always()
        run: |
          mkdir -p ci-output
          cp -r app/build/reports/tests ci-output/unit-tests-report 2>/dev/null || true
          cp -r app/build/test-results ci-output/unit-test-results 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk ci-output/ 2>/dev/null || true

      - name: Завантажити APK (артефакт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerostat-apk-and-logs
          path: ci-output/

      - name: KVM для емулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Емулятор — встановлення, запуск, UI-тести
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-tests.sh

      - name: Опублікувати результати в гілку build-output
        if: always()
        run: |
          set -x
          cp app/build/outputs/apk/debug/app-debug.apk ci-output/ 2>/dev/null || true
          echo "device step outcome: ${{ steps.device.outcome }}" > ci-output/device_outcome.txt
          git config user.name "aerostat-ci"
          git config user.email "ci@users.noreply.github.com"
          rm -rf /tmp/out && mkdir /tmp/out && cp -r ci-output/. /tmp/out/
          git fetch origin build-output || true
          git switch --orphan build-output-new
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/. .
          echo "${{ github.sha }}" > SOURCE_COMMIT.txt
          git add -A
          git commit -q -m "Збірка ${{ github.run_number }} з ${{ github.sha }}"
          git push -f origin HEAD:build-output

      - name: Підсумок
        if: always()
        run: |
          echo "Емулятор: ${{ steps.device.outcome }}"
          cat ci-output/device/status.txt 2>/dev/null || true
          test "${{ steps.device.outcome }}" = "success"
